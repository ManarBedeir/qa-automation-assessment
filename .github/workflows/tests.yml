name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B -ntp clean test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            ui-tests/target/screenshots/
